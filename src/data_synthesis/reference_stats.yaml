# Reference statistics for synthetic data generation.
#
# Every value here must have a matching row in docs/data_provenance.md. Values marked
# `status: seeded_from_planning_doc` are the concrete example figures already quoted in the
# project's planning doc; they are usable but not yet cross-checked against full paper text.
# Values marked `status: assumed_default` are standard adult-population defaults used only to
# keep the generator runnable end-to-end — replace with cited figures before treating outputs
# as anything more than a structural placeholder dataset.
#
# TODO: extract remaining values from full text of Sinha et al., Ohte et al., Bhosale et al.,
# the 2 Kaggle datasets, and the wearable HRV/sleep dataset (see docs/data_provenance.md).

