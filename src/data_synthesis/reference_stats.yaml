# Reference statistics for synthetic data generation.
#
# Every value here must have a matching row in docs/data_provenance.md. Status legend:
#   derived_from_dataset   -- computed directly from a real dataset in data/raw/ via
#                             src/data_synthesis/reference_extraction.py (reproducible, cited)
#   seeded_from_planning_doc -- concrete example figures already quoted in the project's
#                             planning doc; usable but not cross-checked against full paper text
#   assumed_default         -- standard adult-population defaults used only to keep the
#                             generator runnable end-to-end; replace before treating outputs as
#                             more than a structural placeholder
#
# Real sources now available (see docs/data_provenance.md for full writeup):
#   mimic_bigquery_extract    -- 11,837 real MIMIC-IV HF admissions (9,293 patients), via BigQuery
#   andrewmvd_kaggle          -- Chicco & Jurman 2020, n=299, the only source here with EF
#   fedesoriano_kaggle        -- n=918 general CVD risk cohort, NOT HF-specific -- cross-check only
#   nhanes_kaggle             -- official CDC NHANES survey, n=5847 adults, general US population,
#                                not HF-specific -- only source here with height/weight/BMI
#
# Still TODO: BNP/NT-proBNP distributions (no source here measures BNP at all --
# nt_probnp_cutoff_pg_ml below remains the planning doc's seeded example), full text of Ohte et al.
# and Sinha et al. beyond what the planning doc quoted.

age:
  mean: 68.72
  sd: 13.73
  min: 18
  max: 95  # MIMIC caps at 91 due to de-identification age-shifting; allow headroom above that cap
  source: mimic_bigquery_extract
  cross_check: {source: sinha_2024, mean: 61.49, sd: 13.88, note: "sinha_2024's general HF cohort skews younger than MIMIC's acute inpatient admissions -- expected, different population"}
  status: derived_from_dataset

sex_ratio:
  male: 0.563
  female: 0.437
  source: mimic_bigquery_extract
  cross_check: {source: andrewmvd_kaggle, male: 0.649}
  status: derived_from_dataset

height_cm:
  male: {mean: 174.32, sd: 7.77, n: 2791}
  female: {mean: 160.46, sd: 7.13, n: 3056}
  source: nhanes_kaggle
  status: derived_from_dataset

weight_kg:
  male: {mean: 86.43, sd: 21.3, n: 2791}
  female: {mean: 75.99, sd: 21.78, n: 3056}
  source: nhanes_kaggle
  status: derived_from_dataset
  note: "real-population SD is much wider than a healthy-only default would suggest -- reflects actual US adult obesity prevalence, appropriate for an HF-risk cohort"

ejection_fraction:
  hfref:
    mean: 32.3
    sd: 6.8
    range: [14, 40]
    n: 219
    source: andrewmvd_kaggle
    status: derived_from_dataset
  hfpef:
    mean: 56.9
    sd: 6.01
    range: [50, 80]
    n: 60
    source: andrewmvd_kaggle
    status: derived_from_dataset
  healthy:
    mean: 62
    range: [55, 70]
    source: null
    status: assumed_default  # andrewmvd is all-HF-patients -- no true healthy-control EF source yet

# Real lab values from the same sources, not yet consumed by generate_patients.py -- kept here so
# Phase 2's EF/BNP -> severity mapping has real renal-function figures ready when it's built.
labs:
  serum_creatinine_mg_dl:
    mean: 1.82
    sd: 1.58
    source: mimic_bigquery_extract
    cross_check: {source: andrewmvd_kaggle, mean: 1.39, sd: 1.03}
    status: derived_from_dataset
  serum_sodium_meq_l:
    mean: 138.44
    sd: 4.24
    source: mimic_bigquery_extract
    cross_check: {source: andrewmvd_kaggle, mean: 136.63, sd: 4.41}
    status: derived_from_dataset

nt_probnp_cutoff_pg_ml:
  under_50: 450
  50_to_75: 900
  over_75: 1800
  source: bhosale_2024
  status: seeded_from_planning_doc

bnp_stage_b_threshold_pg_ml:
  value: 35
  source: aha_acc_hfsa_2022
  status: seeded_from_planning_doc

nyha_mets:
  I: {min: 7, max: null}
  II: {min: 5, max: 7}
  III: {min: 2, max: 5}
  IV: {min: 0, max: 2}
  source: nyha_classification
  status: seeded_from_planning_doc

scenario_types:
  - stable
  - fluid_overload
  - cardiac_stress
  - deconditioning
  - acute_deterioration

# Deliberately NOT replaced with MIMIC's mean_hr (84.75, sd 15.06) or fedesoriano's RestingBP
# (132.4, sd 18.5): both are measurements of acutely-ill inpatients / a coronary-clinic cohort,
# not an at-home stable/mildly-symptomatic wearable user -- using them here would make every
# synthetic patient look tachycardic at baseline. They ARE a useful sanity ceiling though: our
# acute_deterioration scenario's resting_hr_bpm delta (see generate_wearable_trends.py) should
# push a patient's HR up toward, not wildly past, MIMIC's real decompensated-inpatient range.
wearable_baseline:
  resting_hr_bpm: {mean: 70, sd: 8}
  spo2_pct: {mean: 97, sd: 1.2}
  sleep_hours: {mean: 7.0, sd: 1.0}
  steps_per_day: {mean: 6000, sd: 2000}
  hrv_rmssd_ms: {mean: 35, sd: 12}
  source: null
  status: assumed_default
  decompensated_hr_reference: {mean: 84.75, sd: 15.06, source: mimic_bigquery_extract, note: "sanity ceiling, not a sampling parameter"}
