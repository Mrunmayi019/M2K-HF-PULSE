server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: this is a single-page React app (see docs/methodology.md's "single-page
    # dashboard" framing) -- any path nginx can't find as a static file falls back to index.html
    # so client-side routing/refreshes on a deep URL don't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
