name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # tests/ is deliberately Docker/Pulse-free (see tests/test_api.py's own docstring): every
      # run_pulse() call is mocked, and the DB layer uses an isolated temp-file SQLite database
      # per test (tests/test_api.py's `client` fixture) -- no external Postgres service needed
      # here even though the real deployment (docker-compose.yml) uses Postgres, since nothing in
      # this suite exercises DATABASE_URL branching beyond what src/api/database.py already does
      # in a couple of lines.
      - name: Run tests
        run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
